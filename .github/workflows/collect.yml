name: collect
on:
  schedule:
    - cron: "7 * * * *"          # every hour; each feed is only fetched when its own tier is due
  workflow_dispatch:
    inputs:
      force:
        description: "Check every feed now, ignoring schedule"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-branch
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"          # print log lines as they happen
  MAX_ENRICH_PER_RUN: "400"      # tag at most 400 articles per run

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Load data branch
        run: bash scripts/load_data.sh
      - name: Collect feeds
        run: python -m collector.collect ${{ inputs.force && '--force' || '' }}
      - name: Fetch text and tag with Gemini
        timeout-minutes: 25          # stop early so progress still gets published
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python -m collector.enrich
      - name: Publish data branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish_data.sh
